name: CI

# No paths filters: the "build" check is required on dev -> main promotion PRs, so it
# must exist on every dev SHA - a filtered-out push would block promotion.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build, vet, and the full test suite on the default backend. The Postgres
  # halves of the dialect tests skip themselves when the DSN is unset.
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "gofmt needed on:"; echo "$unformatted"; exit 1; fi
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: frontend static check
        run: go run ./scripts/checkweb
      - name: test
        run: go test ./... -count=1
      - name: smoke
        run: ./scripts/smoke.sh

  # The same suite against a real Postgres. GOBOOKSHELF_TEST_POSTGRES_DSN
  # switches every test database - including the ones the API contract tests
  # build - onto Postgres, so this job is the whole application running on the
  # other backend rather than a handful of extra assertions.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookshelf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GOBOOKSHELF_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/bookshelf_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: test (postgres)
        run: go test ./... -count=1
      - name: smoke (postgres)
        env:
          GOBOOKSHELF_DB_DSN: postgres://postgres:postgres@localhost:5432/bookshelf_smoke?sslmode=disable
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'DROP DATABASE IF EXISTS bookshelf_smoke'
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE bookshelf_smoke'
          ./scripts/smoke.sh --driver postgres

  build:
    permissions:
      contents: read
      packages: write
    needs: [test-sqlite, test-postgres]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Runs on every push to dev so the "build" check lands on the SHA the
      # dev -> main PR points at. Push events also publish the dev image
      # (:dev + :dev-<sha>); pull requests only validate the build.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-,format=short

      - name: Build (push dev image on push events)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
