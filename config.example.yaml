# go-bookshelf bootstrap configuration.
#
# This file holds only the values that must be known before the database is
# open. Everything else - the base URL, session and cookie behaviour, the scan
# interval, single sign-on, reverse-proxy authentication, the metadata provider
# and the /metrics allow list - is entered in the setup wizard at /setup and
# edited afterwards under Admin, Settings. It is stored in the database, with
# credentials encrypted.
#
# Unknown keys are refused rather than ignored, so a file left over from an
# older release fails loudly instead of looking like it still works.
#
# Every key below can also be set with a GOBOOKSHELF_* environment variable, and
# the environment always wins. Copy to config.yaml and pass it with -config, or
# set GOBOOKSHELF_CONFIG to its path.
#
# GOBOOKSHELF_SECRETS_KEY has no key here on purpose: it decrypts what is in the
# database, and it should not be sitting in a file next to it. Set it in the
# environment. Generate one with:
#
#   openssl rand -base64 32

# Address to bind. GOBOOKSHELF_LISTEN
listen: ":8080"

# Database backend: sqlite or postgres. GOBOOKSHELF_DB_DRIVER
#
# sqlite is one file and no server, which is the right answer for a single box.
# postgres is for running on more than one machine, or on a scheduler that may
# move this process between machines: with it, nothing is kept on local disk.
db_driver: "sqlite"

# SQLite database file. GOBOOKSHELF_DB_PATH
# Only meaningful when db_driver is sqlite; setting it alongside postgres is
# refused rather than ignored.
db_path: "/data/go-bookshelf.db"

# Postgres connection string. GOBOOKSHELF_DB_DSN
# Required when db_driver is postgres, refused otherwise. It may carry a
# password, so it is only ever logged with the password replaced - and if you
# would rather it were not in a file at all, set it in the environment.
#
#   db_dsn: "postgres://bookshelf:PASSWORD@db.example.com:5432/bookshelf?sslmode=require"
db_dsn: ""

# Optional writable directory used as a cover cache. GOBOOKSHELF_DATA_DIR
#
# Leave it empty and the server writes nothing to local disk: cover images are
# served straight from the database. Set it and the same images are mirrored
# into it and served from there, which saves a round-trip and costs nothing if
# the directory is lost.
data_dir: ""

# trace | debug | info | warn | error. GOBOOKSHELF_LOG_LEVEL
log_level: "info"
